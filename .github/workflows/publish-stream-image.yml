name: Publish stream image

# Builds the Selkies-based host image (stream/Dockerfile) and pushes it to the
# GitHub Container Registry, so that running the stream anywhere is one
# `docker run` against a pinned, already-built image.
#
# This workflow builds and publishes. It does not run a session, it does not
# serve one, and it does not open a tunnel — there is no job here that a player
# could connect to. Building and publishing the project's software is what
# GitHub Actions is for; running a game on GitHub's compute so that other people
# can play it is "activity unrelated to the production, testing, deployment, or
# publication of the software project" under GitHub's Additional Product Terms,
# and it is what got this project's earlier account suspended. STREAMING.md has
# the whole argument; keep this file on the building side of that line.
#
# Where a session runs: on a machine you own or rent —
#
#   docker run -d --shm-size=2g -p 127.0.0.1:8080:8080 \
#     -e SELKIES_BASIC_AUTH_PASSWORD=... \
#     -v ~/.webmc-stream:/home/ubuntu/.webmc \
#     ghcr.io/amphibbiandev/webmc-launcher-stream:latest
#
# (stream/run.sh does exactly that, with the checks and the GPU detection.)

on:
  push:
    branches: [main]
    paths:
      - "stream/**"
      - "tools/**"
      - "mods/**"
      - ".github/workflows/publish-stream-image.yml"
  workflow_dispatch:
    inputs:
      push:
        description: "Push the image to GHCR (unset = build only, to check it still builds)"
        type: boolean
        default: true

concurrency:
  group: publish-stream-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-24.04
    # The upstream desktop layer is a large pull, and the two architectures are
    # emulated. This is a ceiling on a build that misbehaves, not a budget.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide the image reference
        id: ref
        env:
          # GHCR rejects an uppercase name, and this owner has two. The registry
          # path is not the repository path.
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/${REPO}-stream" >> "$GITHUB_OUTPUT"
          echo "Pushing to ghcr.io/${owner}/${REPO}-stream"

      - name: Set up QEMU
        # So the arm64 half builds on an amd64 runner: the same image then runs
        # on an Apple Silicon Mac and on an Always Free Ampere VM.
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' || inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push what the event asks for)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: stream/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || inputs.push }}
          tags: |
            ${{ steps.ref.outputs.image }}:latest
            ${{ steps.ref.outputs.image }}:sha-${{ github.sha }}
          # Anonymous pulls, so a host that just wants to run the stream needs
          # no GitHub login at all. Point this at the package's own settings if
          # that turns out to be wrong for you.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=WebMC stream host
            org.opencontainers.image.description=A Selkies session that runs Minecraft: Java Edition on a machine you own
          cache-from: type=gha
          cache-to: type=gha,mode=max
